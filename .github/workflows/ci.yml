name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mort moves fast; catch CLI/doc-layout changes that break the tools.
    - cron: "41 4 * * *"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: 0xmortuex/Mort
          path: mort-src
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.0" "mypy==2.3.0" ".[test]" ./mort-src ziglang
      - run: ruff check src tests
      - run: mypy --strict src
      - run: pytest tests -v
        env:
          MORT_HOME: ${{ github.workspace }}/mort-src
