[project]
name = "mort-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents write, type-check and run Mort - a language they've never seen - with spec and stdlib lookup."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
dependencies = ["mcp>=2.0.0"]
keywords = ["mcp", "mort", "compiler", "programming-language", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
]

[project.optional-dependencies]
test = ["pytest>=7", "anyio"]

[project.urls]
Homepage = "https://github.com/0xmortuex/mort-mcp"

[project.scripts]
mort-mcp = "mort_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mort_mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
